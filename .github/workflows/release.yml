name: Release

# Pushing a tag such as v0.1.0 builds the extension and attaches the VSIX to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run package

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --generate-notes

      # Marketplace publishing is manual for now: download the VSIX from the GitHub release and
      # upload it at https://marketplace.visualstudio.com/manage (and at open-vsx.org).
      # To automate later, store access tokens as repository secrets and uncomment these steps.
      # - run: npx vsce publish --packagePath ./*.vsix --no-dependencies
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # - run: npx ovsx publish ./*.vsix
      #   env:
      #     OVSX_PAT: ${{ secrets.OVSX_PAT }}
